name: LuaRocks Release
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  luarocks-release:
    runs-on: ubuntu-latest
    name: LuaRocks Upload
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: LuaRocks Upload
        uses: lumen-oss/luarocks-tag-release@v9.13.0
        with:
          version: "0.5.0"
          license: "GPLv2"
          detailed_description: |
            Toggle between boolean values under your cursor.
          labels: |
            neovim
          copy_directories: |
            {{ neovim.plugin.dirs }}
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
