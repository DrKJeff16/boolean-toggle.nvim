name: Stylua
on:
  push:
    paths:
      - '**.lua'
      - '.github/workflows/stylua.yml'
      - '.stylua.toml'
      - 'stylua.toml'
  pull_request:
    paths:
      - '**.lua'
      - '.github/workflows/stylua.yml'
      - '.stylua.toml'
      - 'stylua.toml'
jobs:
  stylua_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Run StyLua
        uses: JohnnyMorganz/stylua-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
